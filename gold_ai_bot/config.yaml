# =============================================================================
# Configurazione Bot Autotrade Gold XAU - DeFi con AI Integrata
# Lingua: italiano | Modalita paper trading attiva di default (SICURA)
# =============================================================================

bot:
  nome: "GoldAI XAU Bot"
  versione: "1.0.0"
  lingua: "it"
  fuso_orario: "Europe/Rome"
  modalita_paper_trading: true      # true = simulazione (consigliato), false = REALE (rischio)
  operativita_h24: true
  multi_trade: true
  max_posizioni_concorrenti: 5

ai:
  attivo: true
  tipo: "ibrido"                    # tecnico + ml
  soglia_confidenza_minima: 0.65
  intervallo_previsione_minuti: 15
  modello_ml: "random_forest"       # random_forest | xgboost | lstm
  usa_llm: false
  llm_provider: "openai"            # openai | anthropic | locale
  llm_api_key: "${LLM_API_KEY}"

trading:
  asset_principale: "XAU/USD"       # Oro vs Dollaro (prezzo riferimento)
  asset_defi: "XAUT"                # Token oro su blockchain (XAUT / PAXG)
  stablecoin: "USDC"                # Stablecoin di scambio (USDC consigliato su DeFi)
  rete_blockchain: "ethereum"       # ethereum | polygon | bsc
  rpc_url: "${ETHEREUM_RPC_URL}"
  indirizzo_wallet: "${WALLET_ADDRESS}"
  chiave_privata: "${PRIVATE_KEY}"  # Usare SOLO se paper_trading=false
  exchange_cex: "binance"           # solo per dati di prezzo (opzionale)
  api_key_cex: "${CEX_API_KEY}"
  api_secret_cex: "${CEX_API_SECRET}"

risk_management:
  capitale_totale_usd: 1000.0
  rischio_per_operazione_percent: 1.0     # % del capitale per singolo trade
  stop_loss_percent: 2.0
  take_profit_percent: 4.0
  trailing_stop_percent: 1.0
  max_drawdown_giornaliero_percent: 5.0
  max_perdite_consecutive: 3
  dimensione_minima_ordine_usd: 10.0
  slippage_tolleranza_percent: 0.5

indicatori_tecnici:
  rsi_periodo: 14
  rsi_sovraacquisto: 70
  rsi_sovravenduto: 30
  macd_veloce: 12
  macd_lento: 26
  macd_segnale: 9
  sma_breve: 20
  sma_lungo: 50
  bollinger_periodo: 20
  bollinger_deviazioni: 2.0

dati:
  timeframe: "15m"
  storico_candele: 500
  prezzo_reale_api: "coingecko"       # coingecko | binance | mock
  aggiornamento_prezzi_secondi: 60

notifiche:
  attive: false
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  email_smtp: false

dashboard:
  attiva: true
  porta: 8080
  host: "0.0.0.0"
  autenticazione_attiva: true
  username: "admin"
  password_hash: "${DASHBOARD_PASSWORD_HASH}"  # genera con: python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('TUAPASSWORD'))"
  session_secret: "${SESSION_SECRET}"

sicurezza:
  rate_limit_attivo: true
  richieste_al_minuto: 60
  blocca_modalita_reale_senza_env: true
  never_save_private_key: true
  allowed_origins: ["http://localhost:8080", "https://localhost:8080"]

llm:
  usa_llm: false
  provider: "ollama"             # ollama | hf | disabled
  modello: "llama3"              # es. llama3, mistral, phi3, gemma
  endpoint: "http://localhost:11434"
  api_key: "${LLM_API_KEY}"
  timeout_secondi: 30

firma_transazioni:
  abilitata_firma_reale: false   # ⚠️ metti true SOLO per trading reale con fondi veri
  chain_id: 1                    # 1=Ethereum, 137=Polygon, 56=BSC
  gas_max_gwei: 100              # blocca invio se gas superiore
  slippage_percent: 0.5
